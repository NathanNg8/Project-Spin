<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Spin</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="machine">
  <h1 class="sr-only">Project Spin</h1>

  <div class="box">
    <div class="reel" aria-hidden="true">
      <div class="strip" id="strip"></div>
      <div class="payline"></div>
    </div>
  </div>

  <button class="handle" id="handle" type="button" aria-label="Pull the handle to spin">
    <span class="handle-knob"></span>
    <span class="handle-arm"></span>
    <span class="handle-base"></span>
  </button>
</main>

<p class="sr-only" id="announce" role="status" aria-live="polite"></p>

<script src="js/ideas.js"></script>
<script src="js/audio.js"></script>
<script src="js/app.js"></script>
</body>
</html>
